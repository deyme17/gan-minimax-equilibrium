noise_dim: 128
seed: 277
n_g: 1
n_d: 5
epochs: 50

D_model:
    name: "D"
    parameters:
        image_channels: 3
        base_channels: 64
        dropout_rate: 0.0
        sn: True
        neg_slope: 0.2
        norm: "none"
        patch: False

G_model:
    name: "G"
    parameters:
        n_z: 128
        image_size: 512
        image_channels: 3
        base_channels: 512


D_optimizer:
    name: "Adam"
    parameters:
        lr: 0.00005
        betas: [0., 0.9]


G_optimizer:
    name: "Adam"
    parameters:
        lr: 0.00005
        betas: [0., 0.9]

loss:
    name: "Wasserstein"
    parameters: {}


# Conclusions: 
#   - every GAN model that uses Wassertain loss suffers from enormous gradient explosion
#   - loss is negative for both D and G and it is very large
#   - D can't classify even the simplest images and output 1 every time
#   - G can't learn from D because D is broken
#   - spectral norm doe not helping, unfortunately
#   - lipschitz constrain can not be reached