noise_dim: 128
seed: 277
n_g: 1
n_d: 2
epochs: 50
G_max_norm: 5
D_max_norm: 5
instance_noise: True
grad_penalty_lambda: 10

D_model:
    name: "D"
    parameters:
        image_channels: 3
        base_channels: 64
        dropout_rate: 0.3
        sn: False
        neg_slope: 0.2
        norm: "none"
        patch: False

G_model:
    name: "G"
    parameters:
        n_z: 128
        image_size: 512
        image_channels: 3
        base_channels: 512


D_optimizer:
    name: "AdamW"
    parameters:
        lr:  0.00007
        betas: [0.5, 0.9]
        weight_decay: 0
        amsgrad: False

G_optimizer:
    name: "AdamW"
    parameters:
        lr:  0.0001
        betas: [0.5, 0.9]
        weight_decay: 0
        amsgrad: False

loss:
    name: "Hinge"
    parameters:
        label_smoothing: 0.05


# Conclusions: 
#   - gradients is exploded but not that much because of gradient penalty
#   - at the start both G and D losses is raised but then its optimize
#   - some kind of equlibrium is rached
#   - to avoid gradient explosion additional regularization is needed