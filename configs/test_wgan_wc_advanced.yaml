noise_dim: 128
seed: 277
n_g: 1
n_d: 5
epochs: 50
G_max_norm: 10
D_max_norm: 10
# grad_penalty_lambda: 10
weight_clip: 0.01

D_model:
    name: "D"
    parameters:
        image_channels: 3
        base_channels: 64
        dropout_rate: 0.0
        sn: False
        neg_slope: 0.2
        norm: "none"
        patch: False

G_model:
    name: "G"
    parameters:
        n_z: 128
        image_size: 512
        image_channels: 3
        base_channels: 512


D_optimizer:
    name: "RMSprop"
    parameters:
        lr: 0.00005

G_optimizer:
    name: "RMSprop"
    parameters:
        lr: 0.00005

loss:
    name: "Wasserstein"
    parameters: {}